buildscript {
    repositories {
        // Use HTTPS for Forge Maven and Sonatype snapshots for ForgeGradle
        maven { url 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        // ForgeGradle 1.2 snapshot (required for older 1.7.10 setups)
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

// Apply the Forge plugin AFTER the buildscript classpath is configured so the 'minecraft' extension
// will be available. The 'minecraft { ... }' block must come after this apply.
apply plugin: 'forge'

version = "1.0"
group = "com.lurarender"
archivesBaseName = "luarender"

// Configure the Minecraft/Forge settings
minecraft {
    // Use the Forge artifact coordinate for 1.7.10
    version = "1.7.10-10.13.4.1614-1.7.10"
    // Directory used by runClient/runServer (IDE/dev workspace tasks)
    runDir = "run"
    // Stable mappings commonly used for 1.7.10
    mappings = "stable_12"
}

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net' }
}

dependencies {
    // Put compile-only/development-only dependencies here if needed.
    // Jars placed in ./libs will be available to the project automatically.
}

processResources {
    // Ensure this task re-runs when version/mcversion change
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // Replace tokens in mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    // Copy everything else
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
