buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

// IMPORTANT: declare the minecraft block BEFORE applying the 'forge' plugin.
// ForgeGradle 1.2 expects this configuration to exist during plugin application.
minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
    mappings = 'stable_12'
}

apply plugin: 'forge'

version = '0.1.0-experimental'
group = 'com.lurarender'

repositories {
    mavenCentral()
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    maven { url = 'https://files.minecraftforge.net/maven' }
}

dependencies {
    // This repository intentionally keeps dependencies minimal and conservative.
    // Full Angelica integration can be added later once the mobile compatibility layer is proven.
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'LuaRender',
            'Implementation-Version': project.version,
            'FMLCorePlugin': '',
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
