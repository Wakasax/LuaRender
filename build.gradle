buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

// Provide a minecraft map on the project ext so older ForgeGradle can see it during plugin application.
ext.minecraft = [
    version: (project.hasProperty('mc_version') && project.hasProperty('forge_version')) ? "${project.property('mc_version')}-${project.property('forge_version')}-${project.property('mc_version')}" : '1.7.10-10.13.4.1614-1.7.10',
    runDir: 'run',
    mappings: 'stable_12'
]

apply plugin: 'forge'

version = '0.1.0-experimental'
group = 'com.lurarender'

minecraft {
    version = project.ext.minecraft.version
    runDir = project.ext.minecraft.runDir
    mappings = project.ext.minecraft.mappings
}

repositories {
    mavenCentral()
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    maven { url = 'https://files.minecraftforge.net/maven' }
}

dependencies {
    // This repository intentionally keeps dependencies minimal and conservative.
    // Full Angelica integration can be added later once the mobile compatibility layer is proven.
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'LuaRender',
            'Implementation-Version': project.version,
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
