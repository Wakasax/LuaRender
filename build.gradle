plugins {
    id 'java'
}

group = 'com.lurarender'
version = '0.1.0-experimental'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    maven { url 'https://files.minecraftforge.net/maven' }
    maven { url 'https://repo.spongepowered.org/maven' }
    maven { url 'https://nexus.gtnewhorizons.com/repository/public/' }
}

configurations {
    compileOnly
}

dependencies {
    // Provide Forge as compileOnly so the mod compiles against Forge APIs, but does not bundle it.
    compileOnly 'net.minecraftforge:forge:10.13.4.1614-1.7.10'
    // Logging API used by the mod
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.2'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.hasProperty('mc_version') ? project.property('mc_version') : '1.7.10'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.hasProperty('mc_version') ? project.property('mc_version') : '1.7.10'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'LuaRender',
            'Implementation-Version': project.version
        )
    }
}

// Ensure the build produces a jar in build/libs that can be placed in the mods folder.

